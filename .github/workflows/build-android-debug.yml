name: Android Debug APK derle
 
# EAS'ın bulut build kotasına/hesap kurulumuna bağlı kalmadan, tamamen
# ücretsiz bir GitHub Actions Linux runner'ında native Android projesini
# üretip (expo prebuild -- bu proje "managed" workflow olduğu için android/
# klasörü repoda yok, her seferinde burada üretiliyor) Gradle ile debug APK
# derler. Bu APK, kendi telefonuna kurup test etmek / ekran görüntüsü almak
# için yeterli -- ama debug keystore ile imzalı olduğundan Play Store'a
# YÜKLENEMEZ. Gerçek mağaza gönderimi için hâlâ "EAS Build (Android)"
# workflow'u (eas-build-android.yml, `eas build --profile production`)
# gerekiyor -- bu ikisi birbirini TAMAMLIYOR, biri yerine geçmiyor:
#   - build-android-debug.yml  -> hızlı, ücretsiz, sadece test amaçlı APK
#   - eas-build-android.yml    -> Play Store'a yüklenebilir imzalı .aab
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-debug.yml'
 
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # mobile/.env'deki (git'e gitmeyen) gerçek değerlerle aynı -- bu
      # değerler gizli değil (API adresi herkese açık, Google client ID'leri
      # uygulamanın içine zaten gömülen genel kimlikler), o yüzden burada düz
      # yazmak güvenli.
      EXPO_PUBLIC_API_URL: https://uspulse-backend.onrender.com/api
      # Google ile giriş artık native @react-native-google-signin/google-signin
      # kullanıyor (bkz. mobile/.env.example) -- Web client ID'yi Google Cloud
      # Console'da oluşturduktan sonra burayı doldur, aşağıdaki gibi:
      # EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: <WEB_CLIENT_ID>.apps.googleusercontent.com
      # Bu APK debug keystore ile imzalandığından, Google Cloud Console'daki
      # Android istemcisine debug keystore'un SHA-1'ini de eklemen gerekir:
      #   keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android
 
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
 
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
 
      - name: Bağımlılıkları kur
        working-directory: mobile
        run: npm ci
 
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
 
      - name: Native Android projesini oluştur (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
 
      - name: build.gradle'a debug'ı da JS paketini içine göm (Metro'suz çalışsın diye)
        # Varsayılan olarak "debug" build type'ı Metro'dan JS çekmeye çalışır --
        # bu yüzden Metro çalışmadan kurulan bir debug APK "Unable to load
        # script" hatası verir. react{} bloğuna debuggableVariants = [] ekleyerek
        # debug build'in de release gibi kendi JS paketini APK'nın içine
        # gömmesini sağlıyoruz -- android/ klasörü her prebuild'de sıfırdan
        # üretildiği için bu düzenlemeyi kalıcı olarak repoya değil, HER
        # ÇALIŞTIRMADA burada yapıyoruz.
        working-directory: mobile/android/app
        run: |
          python3 - <<'PY'
          path = "build.gradle"
          with open(path) as f:
              content = f.read()
          marker = '    bundleCommand = "export:embed"\n'
          assert marker in content, "bundleCommand satırı beklenen şekilde bulunamadı -- expo prebuild çıktısı değişmiş olabilir."
          content = content.replace(marker, marker + "    debuggableVariants = []\n")
          with open(path, "w") as f:
              f.write(content)
          print("build.gradle güncellendi: debug build artık JS paketini kendi içine gömecek.")
          PY
 
      - name: gradlew'i çalıştırılabilir yap
        run: chmod +x mobile/android/gradlew
 
      - name: Debug APK derle
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
 
      - name: APK'yı Actions artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: uspulse-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14