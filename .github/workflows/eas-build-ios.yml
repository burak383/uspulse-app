name: EAS Build (iOS)

# Production profiliyle YENİ bir iOS build alir (App Store'a otomatik
# gondermez). Bilerek ayri bir workflow -- build almakla App Store'a
# gondermek farkli, geri alinamaz adimlar, ikisini otomatik zincirlemek
# istemiyoruz. SADECE elle tetiklenir.
#
# Build basariyla bittikten sonra App Store'a gondermek icin
# eas-submit-ios.yml'i elle tetikle.
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build iOS production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: EAS CLI kur ve giriş yap
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: iOS production build al
        run: eas build --platform ios --profile production --non-interactive --wait