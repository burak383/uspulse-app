# Render "Blueprint" tanımı -- bu dosyanın tek amacı, servisin gerçekte hangi
# ortam değişkenlerine ihtiyaç duyduğunu kod içinde belgelemek (bkz.
# .env.example) ve Render Dashboard'daki manuel servis kurulumunu
# tekrarlanabilir hâle getirmek. Hiçbir gerçek sır/anahtar değeri BURADA
# saklanmaz -- "sync: false" işaretli her değişken Dashboard'dan elle
# girilmelidir; bu dosya sadece hangi değişkenlerin var olması gerektiğini
# söyler.
#
# Kullanım: Render Dashboard'da "New > Blueprint" ile bu repo'yu bağlarsan bu
# dosya otomatik okunur. Zaten manuel oluşturulmuş bir servisin varsa, bu
# dosyayı değiştirmen gerekmez -- sadece burada listelenen değişkenlerin
# Dashboard'daki servisinde de tanımlı olduğunu doğrulaman yeterli.
services:
  - type: web
    name: uspulse-server
    runtime: node
    # Node sürümü ".node-version" dosyasından (server/.node-version) alınır --
    # better-sqlite3 gibi native (V8 ABI'sine bağlı) bağımlılıklar yüzünden
    # bilerek SABİT bir sürüm kullanılıyor. Eskiden buradaki tek kısıt
    # package.json'daki "engines.node": ">=20.11.0" idi (üst sınırsız); Render
    # yeni bir Node sürümü sunmaya başladığında (ör. 26.x, sonra 24.x) bu
    # aralığa uyduğu için sessizce ona geçti, ama Render'ın deploy'lar arası
    # yeniden kullandığı node_modules cache'i ESKİ Node'un ABI'siyle
    # derlenmiş better-sqlite3 binary'sini içeriyordu -- ".node-version"
    # sabitlense bile cache paket sürümü değişmediği için "npm install"
    # better-sqlite3'e dokunmuyor, dolayısıyla binary hep eski ABI'de
    # kalıyordu ("NODE_MODULE_VERSION uyuşmazlığı" ile açılışta çöküyordu).
    # Asıl kalıcı çözüm package.json'daki "postinstall": "npm rebuild
    # better-sqlite3" -- bu, cache'ten ne gelirse gelsin her deploy'da
    # native modülü OANKİ Node sürümüne göre yeniden derliyor.
    # Kalıcı disk (aşağıdaki "disks" bloğu) sadece ücretli planlarda
    # kullanılabiliyor -- bu yüzden "starter" (en ucuz ücretli plan, aylık
    # sabit bir ücret) seçili. "free" planda disk eklenemez.
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Kalıcı disk: SQLite DB'si ve yüklenen anı medyaları artık her
    # restart/deploy'da silinmek yerine burada kalıcı olarak saklanır --
    # ör. Play Store/App Store incelemesi için oluşturulan bir reviewer
    # hesabı da dahil. Dashboard'da "New > Blueprint" ile senkronize
    # etmiyorsan (zaten manuel oluşturulmuş bir servisin varsa), bu bloğu
    # Dashboard > Disks sekmesinden elle eklemen gerekir: mount path olarak
    # aşağıdaki /var/data'yı kullan.
    disks:
      - name: uspulse-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      # Render'ın kendisi otomatik ayarlar; burada sadece belgeleme amaçlı.
      - key: NODE_ENV
        value: production
      # Sunucunun kendi PORT'unu Render zaten otomatik enjekte eder; kodda
      # process.env.PORT okunuyor (bkz. src/index.ts), burada elle set
      # etmene gerek yok -- Render bu satırı görmezden gelip kendi değerini
      # kullanır.
      - key: PORT
        value: 4000
      # --- Aşağıdakiler gerçek sır/anahtar değerleri: repo'ya asla gerçek
      # değerleriyle commit edilmemeli, Dashboard > Environment'tan girilmeli.
      - key: JWT_SECRET
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      # Şifre sıfırlama e-postalarını gerçekten göndermek için (bkz. email.ts,
      # .env.example). Boş bırakılırsa sistem çalışmaya devam eder ama kod
      # hiçbir yere gitmez, sadece sunucu loguna yazılır.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Sign in with Apple: identity token'ın "aud" claim'i buradaki
      # değer(ler)e karşı doğrulanır. Boş bırakılırsa kod varsayılan olarak
      # 'app.uspulse.mobile' (uygulamanın bundle ID'si) kullanır -- bkz.
      # routes/auth.ts APPLE_AUDIENCES. Bu değişkeni Dashboard'a eklemen
      # ŞART DEĞİL, sadece başka bir bundle ID/Services ID de kabul etmen
      # gerekirse buraya virgülle ayırarak ekleyebilirsin.
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      # Yukarıdaki kalıcı diskin bağlandığı /var/data yolunun altında --
      # böylece DB dosyası ve yüklenen medyalar artık restart/deploy'larda
      # silinmiyor.
      - key: DB_PATH
        value: /var/data/uspulse.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
